<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Face Gradient -->
    <linearGradient id="top-face" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="left-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="right-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glow Filter for Sparkle -->
    <filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#ambient-glow)" />

  <!-- Base Squircle with Glass Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- 3D Isometric Cube / NPM Package -->
  <g filter="url(#shadow)">
    <!-- Top Face (Glossy / Bright) -->
    <path d="M32 13.5 L49 22.8 L32 32.2 L15 22.8 Z" fill="url(#top-face)" />
    
    <!-- Top Face Seam / Fold Accent -->
    <path d="M32 13.5 L32 32.2" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" />
    <path d="M15 22.8 L49 22.8" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.25" />

    <!-- Left Face (Indigo / Violet) -->
    <path d="M15 22.8 L32 32.2 L32 50.5 L15 41.2 Z" fill="url(#left-face)" />
    
    <!-- Left Face Modern Stylized "A" Accent / Inset -->
    <path d="M23.5 28 L28.5 41.5 M23.5 28 L18.5 41.5 M20 37 L27 37" stroke="#a5b4fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" />

    <!-- Right Face (Cyan / Sky) -->
    <path d="M32 32.2 L49 22.8 L49 41.2 L32 50.5 Z" fill="url(#right-face)" />

    <!-- Right Face Stylized Code / Package Brackets -->
    <path d="M37 32 L44 36 L37 40" stroke="#bae6fd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" fill="none" />
    <path d="M41 43.5 L46 46.5" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- Front Center Vertical Edge Highlight -->
    <path d="M32 32.2 L32 50.5" stroke="#e0e7ff" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Accent Sparkle Top Right -->
  <g filter="url(#sparkle-glow)">
    <path d="M49 11 C49 13.5 50.5 15 53 15 C50.5 15 49 16.5 49 19 C49 16.5 47.5 15 45 15 C47.5 15 49 13.5 49 11 Z" fill="#ffffff" />
    <circle cx="49" cy="15" r="1" fill="#38bdf8" />
  </g>
</svg>